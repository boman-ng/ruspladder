[package]
name = "ruspladder"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Rust migration of SplAdder's non-visual alternative splicing analysis"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdf5 = { package = "hdf5-metno", version = "0.14", features = ["static", "zlib"] }
rayon = "1.11"
rust-htslib = { version = "1.0.1", default-features = false, features = ["bzip2", "lzma"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
